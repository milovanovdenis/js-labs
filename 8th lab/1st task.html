<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="width: 100%; height: 100%; background-color: rgba(60,60,60,255);">
        <div style="display: flex; justify-content: center;">
            <button onclick="api_request()">запросить картинку</button>
        </div>
        <div style="display: flex; justify-content: center;">
            <image src="https://avatars.mds.yandex.net/i?id=4cc79c3483328a83c9cd56fde3deb7d6_l-4492055-images-thumbs&n=13" id="api_image"></image>
        </div>
    </div>
</body>
</html>

<style>
    body, html { width: 100%; height: 100%; }
    img {width: 100%; height: 100%;}
</style>

<script>
    async function api_request () {
        document.getElementById("api_image").src = "https://cdn.dribbble.com/users/766394/screenshots/2257218/metaball-loader.gif"
        fetch('https://api.thecatapi.com/v1/images/search?&api_key=live_ul7j1qodkNfswf8vvZbVVZfQge5UeICvl00sy7GnqVYZ7A4ySOZZlvkQmxry0SNb')
        .then((response) => response.json())
        .then((data) => {
            document.getElementById("api_image").src = data[0].url
        })
        .catch(error => console.log(error))
    }
</script>
